<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="assets.css">
<style>
  html,body { width:440px; height:280px; }
  body {
    background:
      radial-gradient(130% 160% at 12% 0%, #5b8dfc 0%, #3e7bfa 45%, #5d5bf5 100%);
    display:flex; flex-direction:column; justify-content:center; padding:0 34px; position:relative;
  }
  .rows { position:absolute; right:-52px; top:50%; transform:translateY(-50%) rotate(-8deg); opacity:.92; }
  .rows .panel { width:190px; border-radius:12px; padding:12px; box-shadow:0 22px 50px rgba(10,20,70,.35); }
  .r { display:flex; align-items:center; gap:7px; padding:5.5px 4px; border-top:1px solid rgba(120,140,170,.12); }
  .r:first-child { border-top:0; }
  .r i { width:7px; height:7px; border-radius:50%; }
  .r span { font-size:9.5px; color:#66758a; }
  .r b { font-size:9.5px; color:#17212d; font-weight:600; }
  .logo { display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .glyph { width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; }
  h1 { color:#fff; font-size:29px; line-height:1.06; font-weight:800; }
  p { color:rgba(255,255,255,.82); font-size:13px; margin-top:9px; font-weight:500; }
</style></head><body>
  <div class="logo">
    <div class="glyph">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <circle cx="10.5" cy="10.5" r="6.2" stroke="#fff" stroke-width="2.6"/>
        <line x1="15.2" y1="15.2" x2="20" y2="20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <span style="color:#fff;font-weight:700;font-size:15px">monday<span style="opacity:.75">.inspector</span></span>
  </div>
  <h1 class="display">The DevTools<br>for monday.com</h1>
  <p>Import subitems · GraphQL · bulk update</p>
  <div class="rows">
    <div class="panel">
      <div class="r"><i style="background:#3e7bfa"></i><b>status</b><span>· color</span><span style="margin-left:auto;color:#0f9e64;font-weight:700">✓</span></div>
      <div class="r"><i style="background:#12b76a"></i><b>person</b><span>· people</span><span style="margin-left:auto;color:#0f9e64;font-weight:700">✓</span></div>
      <div class="r"><i style="background:#f79009"></i><b>date4</b><span>· date</span><span style="margin-left:auto;color:#0f9e64;font-weight:700">✓</span></div>
      <div class="r"><i style="background:#8a63ff"></i><b>timeline</b><span>· range</span><span style="margin-left:auto;color:#0f9e64;font-weight:700">✓</span></div>
    </div>
  </div>
</body></html>
